# Autonomous Job Hunter - configuration
# Everything variable lives here (never hardcoded in code). Secrets NEVER go here: use .env.

schedule:
  timezone: America/Chihuahua
  days: [monday, tuesday, wednesday, thursday, friday]
  times: ["07:00", "13:00", "19:00"]
  # what to do when a run is still active when the next slot arrives
  overlap_policy: skip          # skip | queue
  # a run whose lock is older than this is considered dead and can be recovered
  lock_ttl_minutes: 90
  # a run may start up to this many minutes after its slot and still count as that slot
  slot_grace_minutes: 120

matching:
  minimum_score: 80
  scoring_version: "1.0"
  # weights are renormalized over the factors that apply to a given job
  weights:
    technical_match: 0.18
    required_skill_match: 0.14
    experience_match: 0.10
    seniority_match: 0.10
    leadership_match: 0.06
    location_match: 0.10
    language_match: 0.05
    compensation_match: 0.10
    industry_match: 0.04
    responsibility_match: 0.08
    preference_match: 0.05
  # score assigned to compensation_match when the posting has no salary information
  undisclosed_compensation_score: 60
  # exchange rates used ONLY to compare published ranges against the candidate's currency.
  # Key format: FROM_TO. Refresh them periodically (as of 2026-09, approximate mid-market).
  fx_rates:
    USD_MXN: 18.5
    EUR_MXN: 20.5
    GBP_MXN: 23.5
    CAD_MXN: 13.5
    USD_EUR: 0.90

applications:
  max_per_source_per_run: 3
  automatic_submission: true
  verify_job_active_before_submit: true
  # applications older than this without a response are marked as no-response for funnel stats
  no_response_after_days: 30

research:
  # research the top N eligible companies per run (those not researched in research_ttl_days)
  top_n_per_run: 5
  research_ttl_days: 60

market:
  compensation_inference: true
  skill_inference: true
  snapshot_period_days: 30
  # minimum sample size before a compensation statistic is reported
  min_sample_size: 3

vault:
  # Overridden by OBSIDIAN_VAULT_PATH when set
  path: ./vault
  job_matches_note: "Job Search/Job Matches.md"
  reports_folder: "Job Search/Reports"
  companies_folder: "Market Intelligence/Companies"
  skills_folder: "Market Intelligence/Skills"

database:
  # Overridden by JOBHUNT_DB_PATH when set
  path: ./data/jobhunt.db

logging:
  dir: ./logs
  level: info

# Job sources. Each has independent rate limits and retry policy (never a global policy).
# automation_policy:
#   discover_only  - discover, analyze, score, prepare, hand off to the user
#   apply_allowed  - automatic submission permitted through an official/permitted method
#   blocked        - do not even query (kept for record)
sources:
  - key: remotive
    name: Remotive
    kind: api
    enabled: true
    automation_policy: discover_only
    base_url: https://remotive.com/api/remote-jobs
    rate_limits: { requests_per_second: 0.5, requests_per_minute: 10, requests_per_hour: 60, concurrency: 1 }
    retry: { max_retries: 3, initial_backoff_ms: 2000, backoff_multiplier: 2, max_backoff_ms: 30000 }
  - key: remoteok
    name: Remote OK
    kind: api
    enabled: true
    automation_policy: discover_only
    base_url: https://remoteok.com/api
    rate_limits: { requests_per_second: 0.2, requests_per_minute: 5, requests_per_hour: 30, concurrency: 1 }
    retry: { max_retries: 2, initial_backoff_ms: 3000, backoff_multiplier: 2, max_backoff_ms: 30000 }
  - key: arbeitnow
    name: Arbeitnow
    kind: api
    enabled: true
    automation_policy: discover_only
    base_url: https://www.arbeitnow.com/api/job-board-api
    rate_limits: { requests_per_second: 0.5, requests_per_minute: 10, requests_per_hour: 100, concurrency: 1 }
    retry: { max_retries: 3, initial_backoff_ms: 2000, backoff_multiplier: 2, max_backoff_ms: 30000 }
  - key: hn_hiring
    name: Hacker News - Who is hiring
    kind: api
    enabled: true
    automation_policy: discover_only
    base_url: https://hn.algolia.com/api/v1
    rate_limits: { requests_per_second: 1, requests_per_minute: 30, requests_per_hour: 300, concurrency: 1 }
    retry: { max_retries: 3, initial_backoff_ms: 1000, backoff_multiplier: 2, max_backoff_ms: 20000 }
  - key: weworkremotely
    name: We Work Remotely
    kind: api
    enabled: true
    automation_policy: discover_only
    base_url: https://weworkremotely.com/remote-jobs.rss
    options:
      feeds:
        - https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss
        - https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss
        - https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss
        - https://weworkremotely.com/categories/remote-management-and-finance-jobs.rss
        - https://weworkremotely.com/remote-jobs.rss
    rate_limits: { requests_per_second: 0.5, requests_per_minute: 10, requests_per_hour: 60, concurrency: 1 }
    retry: { max_retries: 2, initial_backoff_ms: 2000, backoff_multiplier: 2, max_backoff_ms: 30000 }
  - key: himalayas
    name: Himalayas
    kind: api
    enabled: true
    automation_policy: discover_only
    base_url: https://himalayas.app/jobs/api
    options: { max_pages: 5, page_size: 100 }
    rate_limits: { requests_per_second: 0.5, requests_per_minute: 10, requests_per_hour: 100, concurrency: 1 }
    retry: { max_retries: 3, initial_backoff_ms: 2000, backoff_multiplier: 2, max_backoff_ms: 30000 }
  # Workday-hosted career sites of large tech companies (public, read-only JSON used by the sites
  # themselves; low volume). Board format: tenant.wdN/SiteName. Add companies as you confirm them.
  - key: workday
    name: Workday career sites
    kind: career_page
    enabled: true
    automation_policy: discover_only
    # AMD uses iCIMS (careers-amd.icims.com), not Workday: no adapter yet, manual review.
    boards:
      - nvidia.wd5/NVIDIAExternalCareerSite
    options:
      "company:nvidia.wd5/NVIDIAExternalCareerSite": NVIDIA
      max_per_board: 40
      fetch_details: true
    rate_limits: { requests_per_second: 0.5, requests_per_minute: 20, requests_per_hour: 200, concurrency: 1 }
    retry: { max_retries: 2, initial_backoff_ms: 3000, backoff_multiplier: 2, max_backoff_ms: 30000 }
  # amazon.jobs exposes a JSON search endpoint, but Amazon's Conditions of Use prohibit robots and
  # data-gathering tools. Kept disabled and adapter-less on purpose: discovery there is manual.
  - key: amazon_jobs
    name: Amazon Jobs (manual only)
    kind: career_page
    enabled: false
    automation_policy: discover_only
    base_url: https://www.amazon.jobs
    rate_limits: { requests_per_second: 0, requests_per_minute: 0, requests_per_hour: 0, concurrency: 0 }
    retry: { max_retries: 0, initial_backoff_ms: 0, backoff_multiplier: 1, max_backoff_ms: 0 }
  # ATS boards (Greenhouse / Lever / Ashby) are official public job-board APIs.
  # Company board tokens are added after the interview (target companies list).
  - key: greenhouse
    name: Greenhouse Job Boards
    kind: ats
    enabled: true
    automation_policy: discover_only
    base_url: https://boards-api.greenhouse.io/v1/boards
    boards:
      - sourcegraph91
    options:
      "company:sourcegraph91": Sourcegraph
    rate_limits: { requests_per_second: 1, requests_per_minute: 30, requests_per_hour: 500, concurrency: 2 }
    retry: { max_retries: 3, initial_backoff_ms: 1000, backoff_multiplier: 2, max_backoff_ms: 20000 }
  - key: lever
    name: Lever Postings
    kind: ats
    enabled: true
    automation_policy: discover_only
    base_url: https://api.lever.co/v0/postings
    boards: []
    rate_limits: { requests_per_second: 1, requests_per_minute: 30, requests_per_hour: 500, concurrency: 2 }
    retry: { max_retries: 3, initial_backoff_ms: 1000, backoff_multiplier: 2, max_backoff_ms: 20000 }
  - key: ashby
    name: Ashby Job Boards
    kind: ats
    enabled: true
    automation_policy: discover_only
    base_url: https://api.ashbyhq.com/posting-api/job-board
    boards:
      - livekit
      - colonist
      - ashby
    options:
      "company:livekit": LiveKit
      "company:colonist": Colonist
      "company:ashby": Ashby
    rate_limits: { requests_per_second: 1, requests_per_minute: 30, requests_per_hour: 500, concurrency: 2 }
    retry: { max_retries: 3, initial_backoff_ms: 1000, backoff_multiplier: 2, max_backoff_ms: 20000 }
  # Platforms whose terms prohibit third-party automation: discovery may only happen through
  # official means; automatic application is never attempted.
  - key: linkedin
    name: LinkedIn
    kind: platform
    enabled: false
    automation_policy: blocked
    rate_limits: { requests_per_second: 0, requests_per_minute: 0, requests_per_hour: 0, concurrency: 0 }
    retry: { max_retries: 0, initial_backoff_ms: 0, backoff_multiplier: 1, max_backoff_ms: 0 }
  - key: indeed
    name: Indeed
    kind: platform
    enabled: false
    automation_policy: blocked
    rate_limits: { requests_per_second: 0, requests_per_minute: 0, requests_per_hour: 0, concurrency: 0 }
    retry: { max_retries: 0, initial_backoff_ms: 0, backoff_multiplier: 1, max_backoff_ms: 0 }
